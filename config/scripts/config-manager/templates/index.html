<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klipper Config Manager</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --border: #e2e4e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1f2228;
      --text: #eceef1;
      --muted: #9aa1ab;
      --border: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .file-path {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 1.5rem;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.6rem;
  }
  .row-text { min-width: 0; }
  .row-label { font-weight: 600; }
  .row-target {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .switch {
    position: relative;
    width: 44px;
    height: 26px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px; width: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.15s ease;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }
  input:disabled + .slider { opacity: 0.5; cursor: wait; }
  .empty, .error {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 1rem 0;
  }
  .error { color: #d9534f; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Klipper Config Manager</h1>
    <div class="file-path" id="file-path">{{ config_file }}</div>
    <div id="rows"><div class="empty">Caricamento...</div></div>
  </div>

<script>
async function loadIncludes() {
  const res = await fetch('/api/includes');
  const data = await res.json();
  renderIncludes(data);
}

function renderIncludes(data) {
  document.getElementById('file-path').textContent = data.config_file;
  const container = document.getElementById('rows');
  container.innerHTML = '';

  if (!data.includes || data.includes.length === 0) {
    container.innerHTML = '<div class="empty">Nessun [include ...] trovato.</div>';
    return;
  }

  for (const item of data.includes) {
    const row = document.createElement('div');
    row.className = 'row';

    const text = document.createElement('div');
    text.className = 'row-text';
    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = item.label;
    const target = document.createElement('div');
    target.className = 'row-target';
    target.textContent = item.target;
    text.appendChild(label);
    text.appendChild(target);

    const switchLabel = document.createElement('label');
    switchLabel.className = 'switch';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = item.enabled;
    input.addEventListener('change', () => toggle(item.line, input));
    const slider = document.createElement('span');
    slider.className = 'slider';
    switchLabel.appendChild(input);
    switchLabel.appendChild(slider);

    row.appendChild(text);
    row.appendChild(switchLabel);
    container.appendChild(row);
  }
}

async function toggle(line, input) {
  input.disabled = true;
  try {
    const res = await fetch('/api/includes/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert('Errore: ' + data.error);
    }
    renderIncludes(data);
  } catch (e) {
    alert('Errore di rete: ' + e);
  }
}

loadIncludes();
</script>
</body>
</html>
