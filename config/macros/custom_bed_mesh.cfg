[gcode_macro BED_MESH_CUSTOM]
description: Bed mesh with an explicit point count (COUNT_X, COUNT_Y), bypassing adaptive meshing. Ex: BED_MESH_CUSTOM COUNT_X=7 COUNT_Y=7 PROFILE=77
gcode:
    {% set count_x = params.COUNT_X|default(3)|int %}
    {% set count_y = params.COUNT_Y|default(3)|int %}
    {% set profile_name = params.PROFILE|default("custom") %}

    # lagrange is limited to 6 points per axis, above that Klipper needs bicubic
    {% set algorithm = "bicubic" if [count_x, count_y]|max > 6 else "lagrange" %}

    # An adaptive meshing wrapper (KAMP, IDM, BTT Eddy) replaces BED_MESH_CALIBRATE
    # with a [gcode_macro] that ignores the PROBE_COUNT it receives and caps the mesh
    # to probe_count in [bed_mesh]. When one is installed, call the renamed original
    # so COUNT_X/COUNT_Y are actually honoured.
    {% if printer['gcode_macro BED_MESH_CALIBRATE'] is defined %}
        _BED_MESH_CALIBRATE PROBE_COUNT={count_x},{count_y} ALGORITHM={algorithm} PROFILE="{profile_name}"
    {% else %}
        BED_MESH_CALIBRATE PROBE_COUNT={count_x},{count_y} ALGORITHM={algorithm} PROFILE="{profile_name}"
    {% endif %}
