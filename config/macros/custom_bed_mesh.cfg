[gcode_macro BED_MESH_CUSTOM]
description: Esegue il bed mesh specificando il probe count (es. COUNT=3 per 3x3 o COUNT=5 per 5x5)
gcode:
    {% set count_x = params.COUNT_X|default(count)|default(3)|int %}
    {% set count_y = params.COUNT_Y|default(count)|default(3)|int %}
    BED_MESH_CALIBRATE PROBE_COUNT={count_x},{count_y} {rawparams}
