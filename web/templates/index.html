<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klipper Config Manager</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --border: #e2e4e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1f2228;
      --text: #eceef1;
      --muted: #9aa1ab;
      --border: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .wrap { max-width: min(920px, 94vw); margin: 0 auto; }
  .top-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .lang-switcher {
    flex: 0 0 auto;
  }
  .lang-switcher select {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    cursor: pointer;
  }
  .file-path {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 1.5rem;
  }
  .section { margin-bottom: 1.75rem; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0 0.1rem 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.6rem;
  }
  .section-title {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .section-count {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.6rem;
  }
  .row-text { min-width: 0; flex: 1; }
  .row-label { font-weight: 600; }
  .row-target {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    overflow-wrap: anywhere;
    margin-top: 0.2rem;
  }
  .row-description {
    font-size: 0.85rem;
    color: var(--muted);
    overflow-wrap: anywhere;
    line-height: 1.4;
    margin-top: 0.35rem;
  }
  .switch {
    position: relative;
    width: 44px;
    height: 26px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px; width: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.15s ease;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }
  input:disabled + .slider { opacity: 0.5; cursor: wait; }
  .empty, .error {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 1rem 0;
  }
  .error { color: #d9534f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1>Klipper Config Manager</h1>
      <div class="lang-switcher">
        <select id="lang-select">
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
      </div>
    </div>
    <div class="file-path" id="file-path">{{ config_file }}</div>
    <div id="rows"><div class="empty">Caricamento...</div></div>
  </div>

<script>
let currentLang = 'en';
let lastData = null;

async function loadIncludes() {
  const res = await fetch('/api/includes');
  const data = await res.json();
  renderIncludes(data);
}

document.getElementById('lang-select').addEventListener('change', (e) => {
  currentLang = e.target.value;
  if (lastData) {
    renderIncludes(lastData);
  }
});

function renderIncludes(data) {
  lastData = data;
  document.getElementById('file-path').textContent = data.config_file;
  const container = document.getElementById('rows');
  container.innerHTML = '';

  if (!data.includes || data.includes.length === 0) {
    container.innerHTML = '<div class="empty">Nessun [include ...] trovato.</div>';
    return;
  }

  const sections = [];
  const sectionByKey = new Map();
  for (const item of data.includes) {
    let section = sectionByKey.get(item.section);
    if (!section) {
      section = { key: item.section, label_en: item.section_en, label_it: item.section_it, items: [] };
      sectionByKey.set(item.section, section);
      sections.push(section);
    }
    section.items.push(item);
  }

  const enabledWord = currentLang === 'it' ? 'abilitati' : 'enabled';

  for (const section of sections) {
    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';

    const head = document.createElement('div');
    head.className = 'section-head';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = currentLang === 'it' ? section.label_it : section.label_en;
    const count = document.createElement('div');
    count.className = 'section-count';
    const enabledCount = section.items.filter((item) => item.enabled).length;
    count.textContent = `${enabledCount}/${section.items.length} ${enabledWord}`;
    head.appendChild(title);
    head.appendChild(count);
    sectionEl.appendChild(head);

    for (const item of section.items) {
      const row = document.createElement('div');
      row.className = 'row';

      const text = document.createElement('div');
      text.className = 'row-text';
      const label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = item.title;
      const target = document.createElement('div');
      target.className = 'row-target';
      target.textContent = item.target;
      text.appendChild(label);
      text.appendChild(target);
      const descriptionText = (currentLang === 'it' && item.description_it)
        ? item.description_it
        : item.description_en;
      if (descriptionText) {
        const description = document.createElement('div');
        description.className = 'row-description';
        description.textContent = descriptionText;
        text.appendChild(description);
      }

      const switchLabel = document.createElement('label');
      switchLabel.className = 'switch';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = item.enabled;
      input.addEventListener('change', () => toggle(item.line, input));
      const slider = document.createElement('span');
      slider.className = 'slider';
      switchLabel.appendChild(input);
      switchLabel.appendChild(slider);

      row.appendChild(text);
      row.appendChild(switchLabel);
      sectionEl.appendChild(row);
    }

    container.appendChild(sectionEl);
  }
}

async function toggle(line, input) {
  input.disabled = true;
  try {
    const res = await fetch('/api/includes/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert('Errore: ' + data.error);
    }
    renderIncludes(data);
  } catch (e) {
    alert('Errore di rete: ' + e);
  }
}

loadIncludes();
</script>
</body>
</html>
