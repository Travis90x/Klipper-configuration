#     INPUT SHAPING

## 1
## Description: ADXL_* macros: run resonance tests per axis/belt and toggle the input shaper on/off.
## IT: Macro ADXL_*: eseguono i test di risonanza per asse/cinghia e attivano/disattivano l'input shaper.
[include macro/scripts/input-shaping/input-shaping.cfg]  # Macro for Input Shaping
## 2
## Description: Generates input-shaper resonance graphs and belt-tension comparison graphs from the console.
## IT: Genera i grafici di risonanza dell'input shaper e i grafici di confronto tensione cinghie dalla console.
[include macro/scripts/input-shaping/shaper-graphs.cfg] # Shaper Graphs for Input Shaping
## 3
## Description: Opens the generated shaper/belt-tension graphs (belts, X, Y) from the console.
## IT: Apre i grafici generati (cinghie, X, Y) dello shaper/tensione cinghie dalla console.
[include macro/scripts/input-shaping/show_graphs.cfg] # Show Shaper Graphs in the console
## 4
## Description: Queries the ADXL345 twice shortly after boot, to skip its usual first-read error.
## IT: Interroga l'ADXL345 due volte poco dopo l'avvio, per saltare il suo consueto errore alla prima lettura.
[include macro/accelerometer/accelerometer_query_boot.cfg] # Accelerometer query on boot

## 1) Choose ADXL345 or LIS2DW - Edit center coordinate, min_freq and max_freq
## Or add the code of this CFG in your printer.cfg
##################################################
# [resonance_tester]
# accel_chip: lis2dw
# accel_chip: adxl345
# probe_points: 150, 150, 150  # an example of the center of the bed, check yours
# min_freq: 25
# max_freq: 150
##################################################

## 5
## Description: [adxl345] wired to the Raspberry Pi MCU.
## IT: [adxl345] collegato alla MCU Raspberry Pi.
# [include macro/accelerometer/adxl345_Raspberry.cfg]      # Adxl345 connected to Raspberry - Attention: include macro/mcu/Raspberry_mcu.cfg

## 6
## Description: [adxl345] wired to a generic RP2040 MCU over SPI.
## IT: [adxl345] collegato a una MCU RP2040 generica via SPI.
# [include macro/accelerometer/adxl345_RP2040.cfg]         # connected to -> cs_pin: RP2040:gpio1  spi_bus: spi0a - Attention: include macro/mcu/RP2040_*
## 7
## Description: [adxl345] wired to the FYSETC RP2040 portable input-shaper board.
## IT: [adxl345] collegato alla scheda FYSETC RP2040 per input shaper portatile.
# [include macro/accelerometer/adxl345_RP2040_fysetc.cfg]  # FYSETC USB - https://github.com/FYSETC/FYSETC-PortableInputShaper
## 8
## Description: [adxl345] wired to the Mellow RP2040-zero USB accelerometer stick.
## IT: [adxl345] collegato alla chiavetta USB Mellow RP2040-zero.
# [include macro/accelerometer/adxl345_RP2040_mellow.cfg]  # MELLOW USB - https://it.aliexpress.com/i/1005005486458306.html?gatewayAdapt=glo2ita
## 9
## Description: [adxl345] wired to a BTT Octopus board's SPI3 header.
## IT: [adxl345] collegato all'header SPI3 di una scheda BTT Octopus.
# [include macro/accelerometer/adxl345_octopus_spi3.cfg]   # ADXL on BTT Octopus SPI3
## 10
## Description: [adxl345] wired to the MKS Robin Nano 1.2's SD card pins.
## IT: [adxl345] collegato ai pin SD card della MKS Robin Nano 1.2.
# [include macro/accelerometer/adxl345_mks-robin-nano-1.2_sdcard.cfg]   # ADXL on Sdcard MKS Robin Nano 1.2 

## 11
## Description: [lis2dw] accelerometer built into the IDM probe.
## IT: Accelerometro [lis2dw] integrato nella sonda IDM.
# [include macro/accelerometer/lis2dw_IDM.cfg]              # IDM with lis2dw - Attention: include macro/sensors/probe/IDM/IDM.cfg
## 12
## Description: [lis2dw] accelerometer built into the Cartographer probe.
## IT: Accelerometro [lis2dw] integrato nella sonda Cartographer.
