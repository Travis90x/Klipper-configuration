## 1)  SET YOUR PINS ##
#######################

############### Buttons for manual Load Unload Filament ##############

## Set PINS for your board
# [board_pins filament_button]
#    button_load_pin=   Your PIN             # Uncomment only if there is a dedicated "load button" (a button for manual load)
#    button_unload_pin= Your PIN             # Uncomment only if there is a dedicated "unload button" (a button for manual unload)

## Description: Runs FILAMENT_LOAD when a dedicated manual-load button is pressed.
## IT: Esegue FILAMENT_LOAD quando viene premuto un pulsante dedicato al caricamento manuale.
# [include macro/sensors/filament_runout/button_load.cfg]
## Description: Runs FILAMENT_UNLOAD when a dedicated manual-unload button is pressed.
## IT: Esegue FILAMENT_UNLOAD quando viene premuto un pulsante dedicato allo scaricamento manuale.
# [include macro/sensors/filament_runout/button_unload.cfg]

############### SWITCH and/or ENCODER PINS ###############

## Set PINS for your board
[board_pins filament_runout]
aliases:
## For BTT Smart Filament Sensor V2 enable both SWITCH and ENCODER
#     filament_switch_pin=  Your PIN   # set your runnout SWITCH PIN
    filament_encoder_pin=PA11   # set your ENCODER PIN 
    
[duplicate_pin_override]  #needed for debug
pins: 
    filament_switch_pin, filament_encoder_pin, filament_unload, filament_load

    
####################################
## 2)  SET YOUR MACRO LOAD UNLOAD ##
####################################


#######################################################
## ADVANCED FILAMENT MACRO ( LOAD - UNLOAD - PURGE ) ##
#######################################################

## Description: Advanced filament load: heats the hotend as needed, then loads and purges the filament.
## IT: Caricamento avanzato del filamento: scalda l'hotend se serve, poi carica e spurga il filamento.
[include macro/sensors/filament_runout/FILAMENT_LOAD.cfg]
## Description: Advanced filament unload: heats the hotend as needed, then retracts and unloads the filament.
## IT: Scaricamento avanzato del filamento: scalda l'hotend se serve, poi ritrae e scarica il filamento.
[include macro/sensors/filament_runout/FILAMENT_UNLOAD.cfg]

## Avoid Runout during Start purging
## use macro FILAMENT_SENSORS_DISABLE in the first part of your START_PRINT
## Description: Temporarily disables the filament runout sensor during the START_PRINT purge, then restores it.
## IT: Disabilita temporaneamente il sensore di runout durante lo spurgo di START_PRINT, poi lo ripristina.
[include macro/sensors/filament_runout/start_disable_sensors.cfg]

## If you use an ENCODER, it is recommended to use the macro below 
## to avoid false positives of the encoder by performing X attempts of purge
## Description: Advanced filament purge with temperature managing, used to retry after a runout before triggering a full change.
## IT: Spurgo avanzato del filamento con gestione della temperatura, usato per ritentare dopo un runout prima di attivare un cambio completo.
[include macro/sensors/filament_runout/FILAMENT_PURGE.cfg]

## Description: Lifts Z by a safe amount for a filament change, without exceeding the printer's maximum Z.
## IT: Solleva la Z di una quantità sicura per un cambio filamento, senza superare la Z massima della stampante.
[include macro/sensors/filament_runout/filament_z_safe.cfg] 

##########################
## SIMPLE LOAD - UNLOAD ##
##########################
## Description: Simple LOAD_FILAMENT/UNLOAD_FILAMENT: fixed-distance extrude/retract with a beep and status message.
## IT: LOAD_FILAMENT/UNLOAD_FILAMENT semplici: estrusione/ritrazione a distanza fissa con un bip e un messaggio di stato.
# [include macro/sensors/filament_runout/simple_load_unload.cfg]


#############################################
## 3)  SET YOUR CHANGE FILAMENT MACRO M600 ##
#############################################

## CHANGE FILAMENT: M600 (change during printing), CHANGE_FILAMENT (change while not printing), M701, M702 
## Description: M600/CHANGE_FILAMENT/M701/M702: pause, move to the change position, and unload/reload filament.
## IT: M600/CHANGE_FILAMENT/M701/M702: mette in pausa, si sposta nella posizione di cambio, e scarica/ricarica il filamento.
[include macro/sensors/filament_runout/filament_change.cfg]
## Description: TEMP_SAVE/TEMP_RESTORE: remembers the hotend temperature across a purge attempt and restores it after.
## IT: TEMP_SAVE/TEMP_RESTORE: memorizza la temperatura dell'hotend durante un tentativo di spurgo e la ripristina dopo.
[include macro/sensors/filament_runout/temp_save_restore.cfg]


#######################################################
## 4)  SET YOUR MACRO AUTOLOAD AUTOUNLOAD ON RUNNOUT ##
#######################################################

## ADVANCED AUTO_LOAD - AUTO_UNLOAD #
## Description: Auto load/unload on runout (switch and/or encoder), with several purge attempts before pausing.
## IT: Carico/scarico automatico al runout (switch e/o encoder), con diversi tentativi di spurgo prima della pausa.
[include macro/sensors/filament_runout/advanced_filament_macro.cfg]  


## Description: Auto load/unload on runout, tailored for the Orbiter filament sensor.
## IT: Carico/scarico automatico al runout, pensato per il sensore filamento Orbiter.
# [include macro/sensors/filament_runout/orbiter_filament_macro.cfg]
## Description: Replaces the standard PAUSE macro with an Orbiter-sensor-aware version.
## IT: Sostituisce la macro PAUSE standard con una versione consapevole del sensore Orbiter.
# [include macro/sensors/filament_runout/orbiter_pause.cfg]


###################################################################
## 5)  CHOOSE SIMPLE OR ADVANCED RUNNOUT (SWTICH AND/OR ENCODER) ##
###################################################################

## BigTreeTech BTT Smart Filament Sensor V2 has both SWITCH and ENCODER
## so you can use both "SWITCH" and "ENCODER"

###################################
