# [include macro/fans/orca_fan_multiplier.cfg]

## Description: EXHAUST_FAN_ON/OFF: turns the exhaust fan on via M106 P3 and auto-shuts it off after a set time.
## IT: EXHAUST_FAN_ON/OFF: accende la ventola di aspirazione via M106 P3 e la spegne da sola dopo un tempo impostato.
# [include macro/fans/exhaust_p3.cfg]


