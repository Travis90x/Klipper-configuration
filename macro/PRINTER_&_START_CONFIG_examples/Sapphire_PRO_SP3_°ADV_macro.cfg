# [include macro/sensors/filament_runout/filament_sensor.cfg] # Filament sensor with switch 

## Description: Defines a BTT Smart Filament Sensor as a [filament_motion_sensor] (encoder-based runout detection).
## IT: Definisce un BTT Smart Filament Sensor come [filament_motion_sensor] (rilevazione runout tramite encoder).
# [include macro/sensors/filament_runout/filament_encoder.cfg]  # Filament sensor with encoder


######################################
#########  ADVANCED RUNNOUT  #########
######################################

## Description: [filament_switch_sensor] wired into the advanced load/unload/runout macros above.
## IT: [filament_switch_sensor] collegato alle macro avanzate di carico/scarico/runout qui sopra.
# [include macro/sensors/filament_runout/advanced_filament_sensor.cfg] # Filament sensor with switch 

## Description: [filament_motion_sensor] wired into the advanced load/unload/runout macros above.
## IT: [filament_motion_sensor] collegato alle macro avanzate di carico/scarico/runout qui sopra.
[include macro/sensors/filament_runout/advanced_filament_encoder.cfg]  # Filament sensor with encoder starts AUTO_LOAD_FILAMENT 

#########################################################
## 6)  SET YOUR DEBUG MACRO FOR RUNNOUT SENSOR/ENCODER ##
#########################################################

## Description: Manually enable/disable/test the filament switch sensor, for debugging.
## IT: Abilita/disabilita/testa manualmente il sensore a interruttore del filamento, per il debug.
# [include macro/sensors/filament_runout/debug_sensor.cfg]

## Description: Manually enable/disable/test the filament encoder sensor, for debugging.
## IT: Abilita/disabilita/testa manualmente il sensore encoder del filamento, per il debug.
[include macro/sensors/filament_runout/debug_encoder.cfg]


[gcode_macro _SENSOR_VARIABLES]              # change here macro configurables, enable disable functions!*************************
variable_filament_load_temp        : 230     # temperature to heat up hotend for filament loading, default is 235
variable_filament_load_min_temp    : 225     # minimum hotend set temperature allowed in filament load macro, default is 190
variable_filament_unload_temp      : 230     # temperature to heat up hotend for filament un-loading, default is 185
variable_filament_unload_min_temp  : 225     # temperature to heat up hotend for filament un-loading, default is 185

variable_disable_autoload          : False   # disable filament autoload feature by setting this variable True
variable_disable_runnout           : False   # disable runnout by setting this variable True
variable_disable_autounload        : False   # disable auto unload filament by setting this variable to True
variable_enable_beep               : False   # uses M300 sound feature, set it True to enable

variable_park_position_x           : 0       # edit your X parking position here for pause macro trigerred by runnout
variable_park_position_y           : 0       # edit your Y parking position here for pause macro trigerred by runnout
variable_park_lift_z               : 10       # edit your Z lift amount for parking position here, default is 10
Variable_park_retraction           : 1       # edit your retraction amount for parking, default is 1

variable_enable_attempts_purge     : True    # On runnout try to purge and resume print, if runnout persists go to the runout procedure
variable_attempts_purge            : 2       # How many purge attempts to make before proceeding with the runout
variable_attempts_temp             : 231     # temperature to heat up hotend for attempts purge
variable_attempts_reset_time       : 30      # s - seconds to reset attempt counter
variable_attempts_retraction       : 5       # mm - retraction before attempts purge

variable_attempts_purge_speed      : 5       # mm/s . Filament purge speed in mm/min 
variable_attempts_purge_length     : 30      # mm - Filament purge amount
variable_attempts_park_position_x  : 0       # edit your X parking position here for purge
variable_attempts_park_position_y  : 0       # edit your Y parking position here for purge

variable_attempts_park_lift_z      : 3       # mm - Z_Lift Z

variable_short_filament_distance   : 5      # The height of heatblock 
variable_short_filament_speed      : 1       # mm/s filament extrude/retract slow speed in the heatblock, adjust this value lower if flow is too high and extruder skips during loading, default is 1
variable_long_filament_distance    : 40      # mm - The distance from extruder to heat block
variable_long_filament_speed       : 5       # mm/s - The fast speed from extruder to heat block and viceversa
variable_move_speed                : 100     # mm/s
gcode:

