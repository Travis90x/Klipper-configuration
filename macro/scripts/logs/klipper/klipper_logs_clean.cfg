[gcode_macro LOGS_KLIPPER_CLEAN]
description: Deletes old klippy.log backup files to free up space.
# IT: Elimina i vecchi file di backup di klippy.log per liberare spazio.
gcode:
    RUN_SHELL_COMMAND CMD=LOGS_KLIPPER_CLEAN

[gcode_shell_command LOGS_KLIPPER_CLEAN]
command: bash LOGS_KLIPPER_CLEAN
# timeout: 5.
verbose: False
