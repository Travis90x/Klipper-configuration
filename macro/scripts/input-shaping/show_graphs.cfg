[gcode_macro show_graph_belts]
Description: Opens the generated belt-tension comparison graph.
# IT: Apre il grafico di confronto tensione cinghie generato.
gcode:
    RUN_SHELL_COMMAND CMD=show_graph_belts

[gcode_shell_command show_graph_belts]
command: bash show_graph_belts
timeout: 60.
verbose: True

[gcode_macro show_graph_x]
Description: Opens the generated X-axis shaper resonance graph.
# IT: Apre il grafico di risonanza dello shaper generato per l'asse X.
gcode:
    RUN_SHELL_COMMAND CMD=show_graph_x

[gcode_shell_command show_graph_x]
command: bash show_graph_x
timeout: 60.
verbose: True

[gcode_macro show_graph_y]
Description: Opens the generated Y-axis shaper resonance graph.
# IT: Apre il grafico di risonanza dello shaper generato per l'asse Y.
gcode:
