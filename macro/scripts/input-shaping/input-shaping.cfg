[gcode_macro ADX]
description: Runs ACCELEROMETER_QUERY to check that the ADXL345 is responding.
# IT: Esegue ACCELEROMETER_QUERY per verificare che l'ADXL345 risponda.
gcode:
    ACCELEROMETER_QUERY  # check ADXL345


[gcode_macro DISABLE_INPUT_SHAPER]  # Useful for ringing tower
description: Disables the input shaper (sets both shaper frequencies to 0), useful for ringing towers.
# IT: Disattiva l'input shaper (imposta a 0 entrambe le frequenze), utile per le ringing tower.
gcode:
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0 

#############################################

[gcode_macro ADXL_Fast_Shaping]
description: Homes if needed, then runs Klipper's built-in SHAPER_CALIBRATE on both axes.
# IT: Fa l'homing se serve, poi esegue lo SHAPER_CALIBRATE nativo di Klipper su entrambi gli assi.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    SHAPER_CALIBRATE

[gcode_macro ADXL_Shaping_X]
description: Homes if needed, then runs a resonance test (TEST_RESONANCES) on the X axis.
# IT: Fa l'homing se serve, poi esegue un test di risonanza (TEST_RESONANCES) sull'asse X.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    TEST_RESONANCES AXIS=X


[gcode_macro ADXL_Shaping_Y]
description: Homes if needed, then runs a resonance test (TEST_RESONANCES) on the Y axis.
# IT: Fa l'homing se serve, poi esegue un test di risonanza (TEST_RESONANCES) sull'asse Y.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    TEST_RESONANCES AXIS=Y


#############################################

[gcode_macro ADXL_Belts]
description: Homes if needed, then runs raw resonance tests on both belt diagonals for tension comparison.
# IT: Fa l'homing se serve, poi esegue test di risonanza grezzi su entrambe le diagonali delle cinghie per confrontarne la tensione.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data
    ACCELEROMETER_QUERY
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data


[gcode_macro ADXL_Belt_UP]
description: Homes if needed, then runs a raw resonance test on one belt diagonal.
# IT: Fa l'homing se serve, poi esegue un test di risonanza grezzo su una diagonale delle cinghie.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    M118 Execute this Command
    M117 Execute this Command
    M118 TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data
    M117 TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data

[gcode_macro ADXL_Belt_DOWN]
description: Homes if needed, then runs a raw resonance test on the other belt diagonal.
# IT: Fa l'homing se serve, poi esegue un test di risonanza grezzo sull'altra diagonale delle cinghie.
gcode:
    ACCELEROMETER_QUERY
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    M118 Execute this Command
    M117 Execute this Command
    M118 TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data
    M117 TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data
