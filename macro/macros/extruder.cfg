[gcode_macro DISABLE_EXTRUDER]
Description: Turns off the extruder stepper motor.
# IT: Spegne il motore dell'estrusore.
gcode:
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro EXTRUDER_CAN]
Description: Reports whether the hotend is hot enough to extrude.
# IT: Dice se l'hotend è abbastanza caldo per estrudere.
gcode:
    M118 Printer can extrude: {printer.extruder.can_extrude}
