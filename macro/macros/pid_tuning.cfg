[gcode_macro PID_BED]
Description: Runs PID_CALIBRATE on the bed heater at TEMP (default 45C).
# IT: Esegue PID_CALIBRATE sul riscaldatore del piano a TEMP (default 45C).
gcode:
    {% set temp_bed = params.TEMP|default(45) %}
    PID_CALIBRATE HEATER=heater_bed TARGET={temp_bed}

[gcode_macro PID_EXTRUDER]
Description: Runs PID_CALIBRATE on the extruder heater at TEMP (default 200C).
# IT: Esegue PID_CALIBRATE sul riscaldatore dell'estrusore a TEMP (default 200C).
gcode:
    {% set temp_extruder = params.TEMP|default(200) %}
    PID_CALIBRATE HEATER=extruder TARGET={temp_extruder}
