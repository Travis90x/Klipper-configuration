[force_move]
enable_force_move: True


[gcode_macro FAKE_HOMING_150]
Description: Fakes the homed position as X150 Y150 Z150 without a real homing move.
# IT: Imposta una posizione di homing fittizia a X150 Y150 Z150, senza un vero homing.
gcode:
    SET_KINEMATIC_POSITION X=150 Y=150 Z=150

[gcode_macro FAKE_Z]
Description: Fakes the current Z position as Z_COORD (default 0), without a real homing move.
# IT: Imposta la posizione Z attuale come fittizia a Z_COORD (default 0), senza un vero homing.
gcode:
    {% set z_coord = params.Z_COORD|default(0) %}
    M118 SET_KINEMATIC_POSITION Z={z_coord}
    M117 SET_KINEMATIC_POSITION Z={z_coord}
    SET_KINEMATIC_POSITION Z={z_coord}

[gcode_macro RELATIVE_COORD]
Description: Fakes the current X/Y/Z position as X_COORD/Y_COORD/Z_COORD, without a real homing move.
# IT: Imposta la posizione X/Y/Z attuale come fittizia a X_COORD/Y_COORD/Z_COORD, senza un vero homing.
gcode:
    {% set x_coord = params.X_COORD|default(0) %}
    {% set y_coord = params.Y_COORD|default(0) %}
    {% set z_coord = params.Z_COORD|default(0) %}
    M117 SET_KINEMATIC_POSITION X={x_coord} Y={y_coord} Z={Z_COORD}
    M118 SET_KINEMATIC_POSITION X={x_coord} Y={y_coord} Z={Z_COORD}
    SET_KINEMATIC_POSITION X={x_coord} Y={y_coord} Z={z_coord}

[gcode_macro DISABLE_X_Y]
Description: Turns off the X and Y stepper motors.
# IT: Spegne i motori degli assi X e Y.
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0    
    SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0


[gcode_macro DISABLE_Z]
Description: Turns off the Z stepper motors.
# IT: Spegne i motori dell'asse Z.
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0    
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=0

[gcode_macro MOVE_BED]
Description: Moves the bed by MOVE_Z mm (default 25) using a fake Z position, without homing.
# IT: Muove il piano di MOVE_Z mm (default 25) usando una posizione Z fittizia, senza homing.
gcode:
    {% set z_med = printer.toolhead.axis_maximum.z / 2 %}
    {% set move_z = params.MOVE_Z|default(25) %}
    {% if move_z | float | abs <= z_med | float %}
        SET_KINEMATIC_POSITION Z={z_med}
        G91
        G1 Z{move_z}
        M84
    {% else %}
        { action_respond_info("Target Z position is outside of the allowed range.") }
        M84
    {% endif %}

[gcode_macro BED_POSITIVE]
Description: Moves the bed up by MOVE_Z mm (default 25) using a fake Z position, without homing.
# IT: Alza il piano di MOVE_Z mm (default 25) usando una posizione Z fittizia, senza homing.
gcode:
    {% set z_med = printer.toolhead.axis_maximum.z / 2 %}
    {% set move_z = params.MOVE_Z|default(25) %}
    {% if move_z | float | abs <= z_med | float %}
        SET_KINEMATIC_POSITION Z={z_med}
        G91
        G1 Z+{move_z | float | abs}
        M84
    {% else %}
        { action_respond_info("Target Z position is outside of the allowed range.") }
        M84
    {% endif %}

[gcode_macro BED_NEGATIVE]
Description: Moves the bed down by MOVE_Z mm (default 25) using a fake Z position, without homing.
# IT: Abbassa il piano di MOVE_Z mm (default 25) usando una posizione Z fittizia, senza homing.
gcode:
    {% set z_med = printer.toolhead.axis_maximum.z / 2 %}
    {% set move_z = params.MOVE_Z|default(25) %}
    {% if move_z | float | abs <= z_med | float %}
        SET_KINEMATIC_POSITION Z={z_med}
        G91
        G1 Z-{move_z | float | abs}
        M84
    {% else %}
        { action_respond_info("Target Z position is outside of the allowed range.") }
        M84
    {% endif %}

[gcode_macro FORCE_MOVE_STEPPER]
Description: Force-moves a single stepper motor by DISTANCE mm, bypassing normal kinematics/homing checks.
# IT: Forza il movimento di un singolo motore di DISTANCE mm, bypassando i normali controlli di cinematica/homing.
gcode:
    {% set stepper_motor = params.STEPPER_MOTOR|default("stepper_x")|string %}
    {% set distance = params.DISTANCE|default(1) | float %}
    {% set velocity = params.VELOCITY|default(100) | float %}
    {% set accel = params.ACCEL|default(1000) | float %}
    M118 FORCE_MOVE STEPPER={stepper_motor} DISTANCE={distance} VELOCITY={velocity} ACCEL={accel}
    FORCE_MOVE STEPPER={stepper_motor} DISTANCE={distance} VELOCITY={velocity} ACCEL={accel}
