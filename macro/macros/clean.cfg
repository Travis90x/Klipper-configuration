[gcode_macro CLEAN]
description: Moves the toolhead to a park/clean position at the front-center of the bed, lifting Z first.
# IT: Sposta il toolhead in una posizione di parcheggio/pulizia al centro-fronte del piano, sollevando prima la Z.
gcode:
 M118 Go to clean position
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set x_med = printer.toolhead.axis_maximum.x / 2 %}
    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% set macro = printer['gcode_macro _MACRO_VARIABLE']|default({}) %}
    Z_SAFE Z={params.Z|default(macro.z_safe_clean)|float}
    G1 X{x_med} Y{y_min} F{client.speed_move|default(60) * 60}
