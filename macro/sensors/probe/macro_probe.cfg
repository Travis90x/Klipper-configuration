[gcode_macro PB]
Description: Does a single PROBE at a safe Z height, for a quick manual check.
# IT: Esegue una singola PROBE a un'altezza Z sicura, per un controllo manuale rapido.
gcode:
    {% set macro = printer['gcode_macro _MACRO_VARIABLE']|default({}) %}
    G1 Z{macro.z_safe_probe}
    # M118 Z_SAFE Z={macro.z_safe_probe}
    PROBE
    G1 Z{macro.z_safe_probe}

[gcode_macro PB_ACCURACY]
Description: Moves to a fixed position and runs PROBE_ACCURACY.
# IT: Si sposta in una posizione fissa ed esegue PROBE_ACCURACY.
gcode:
    G90
    G0 Z10 F1000
    G0 X165 Y165 F9000
    PROBE_ACCURACY

[gcode_macro PB_QUERY] # Test BL TOUCH
Description: Runs QUERY_PROBE five times with pauses, to test the probe (e.g. a BLTouch) for consistency.
# IT: Esegue QUERY_PROBE cinque volte con pause, per testare la coerenza della sonda (es. un BLTouch).
gcode:
    QUERY_PROBE
    G4 P3000 
    QUERY_PROBE
    G4 P3000
    QUERY_PROBE
    G4 P3000 
    QUERY_PROBE
    G4 P3000
    QUERY_PROBE
