[gcode_macro BED_MESH_CALIBRATE]
description: Renames the stock BED_MESH_CALIBRATE; the IDM needs its bed heater off first on AC beds >500W.
# IT: Rinomina il BED_MESH_CALIBRATE di serie; l'IDM richiede il riscaldatore del piano spento sui piani AC >500W.
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% set TARGET_TEMP = printer.heater_bed.target %}
    M140 S0
    _BED_MESH_CALIBRATE {rawparams}
    M140 S{TARGET_TEMP}
