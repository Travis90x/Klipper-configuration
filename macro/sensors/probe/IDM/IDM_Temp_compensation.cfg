[gcode_macro IDM_TEMP_COMPENSATION]
description: Runs a full temperature-compensation calibration cycle for the IDM probe (heats/cools the bed and hotend through several Z heights).
# IT: Esegue un ciclo completo di calibrazione della compensazione termica per la sonda IDM (scalda/raffredda piano ed hotend a diverse altezze Z).
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|int %}
  {% set nozzle_temp = params.NOZZLE_TEMP|default(280)|int %}
  {% set min_temp = params.MIN_TEMP|default(40)|int %}
  {% set max_temp = params.MAX_TEMP|default(65)|int %}
  M118 Temp Compensation start...
  M106 S255
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28
  G0 Z1
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={min_temp}
  IDM_STREAM FILENAME=data1
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=data1
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28 Z0
  G0 Z2
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  IDM_STREAM FILENAME=data2
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=data2
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28 Z0
  G0 Z3
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  IDM_STREAM FILENAME=data3
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=data3
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MAXIMUM={min_temp}
  M106 S0
  G28 Z0
  G0 Z5
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  IDM_STREAM FILENAME=data4
  TEMPERATURE_WAIT SENSOR='temperature_sensor IDM_coil' MINIMUM={max_temp}
  IDM_STREAM FILENAME=data4
  M104 S0
  M140 S0
  RUN_SHELL_COMMAND CMD=IDM_Temp_compensation
  M118 IDM Temp Compensation complete!

[gcode_macro IDM_TEMP_CALC]
description: Recomputes the IDM temperature-compensation curve from previously collected calibration data.
# IT: Ricalcola la curva di compensazione termica IDM dai dati di calibrazione raccolti in precedenza.
gcode:
    RUN_SHELL_COMMAND CMD=IDM_Temp_compensation
    M118 IDM Temp calc complete!

[gcode_shell_command IDM_Temp_compensation]
command: sh /home/pi/printer_data/config/macro/sensors/probe/IDM/IDM_Temp_compensation.sh
timeout: 6000.
verbose: True
