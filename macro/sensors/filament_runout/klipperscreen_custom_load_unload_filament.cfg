[gcode_macro LOAD_FILAMENT]
description: Redirects KlipperScreen's LOAD_FILAMENT to this repo's own FILAMENT_LOAD macro.
# IT: Reindirizza la LOAD_FILAMENT di KlipperScreen alla macro FILAMENT_LOAD di questo repo.
gcode:
    FILAMENT_LOAD

[gcode_macro UNLOAD_FILAMENT]
description: Redirects KlipperScreen's UNLOAD_FILAMENT to this repo's own FILAMENT_UNLOAD macro.
# IT: Reindirizza la UNLOAD_FILAMENT di KlipperScreen alla macro FILAMENT_UNLOAD di questo repo.
gcode:
    FILAMENT_UNLOAD
